services:
  pixel-office:
    build: .
    image: pixel-office:latest
    restart: unless-stopped
    ports:
      - "8790:8790"
    environment:
      # Leave these unset to have them generated on first start (printed once in `docker compose logs`).
      PIXEL_OFFICE_PASSWORD: ${PIXEL_OFFICE_PASSWORD:-}
      PIXEL_OFFICE_INGEST_TOKEN: ${PIXEL_OFFICE_INGEST_TOKEN:-}
      # Behind a TLS-terminating reverse proxy (Caddy, Traefik, nginx):
      # PIXEL_OFFICE_TRUST_PROXY: "true"
    volumes:
      - pixel-office-data:/data

volumes:
  pixel-office-data:
